<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMF · Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="profile-card">
    <div class="profile-layout">

      <!-- Cột trái: Avatar + tên -->
      <div class="profile-avatar-section">
        <div class="avatar-frame">
          <img id="avatar" src="" alt="Avatar" class="avatar-img">
        </div>
        <div class="profile-name" id="name">LMF</div>
        <div class="profile-tag">
          <i class="fas fa-code"></i> <span id="tagline"></span>
        </div>
      </div>

      <!-- Cột phải -->
      <div class="profile-info-section">

        <!-- Bio -->
        <div class="bio">
          <p>
            <i class="fas fa-quote-left"></i>
            <span id="bio"></span>
          </p>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-icon"><i class="fas fa-briefcase"></i></div>
            <div class="stat-label">Kinh nghiệm</div>
            <div class="stat-value" id="stat-exp"></div>
          </div>
          <div class="stat-item">
            <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
            <div class="stat-label">Dự án</div>
            <div class="stat-value" id="stat-projects"></div>
          </div>
          <div class="stat-item">
            <div class="stat-icon"><i class="fas fa-smile"></i></div>
            <div class="stat-label">Hài lòng</div>
            <div class="stat-value" id="stat-satisfaction"></div>
          </div>
          <div class="stat-item">
            <div class="stat-icon"><i class="fas fa-coffee"></i></div>
            <div class="stat-label">Cà phê / ngày</div>
            <div class="stat-value" id="stat-coffee"></div>
          </div>
        </div>

        <!-- KỸ NĂNG — làm sáng nổi bật -->
        <div class="section-block skills-block">
          <h3 class="section-title">
            <i class="fas fa-bolt"></i> Kỹ năng
          </h3>
          <div class="skills">
            <div class="skill-item">
              <span class="skill-name"><i class="fas fa-code"></i> HTML/CSS</span>
              <div class="skill-bar-bg"><div class="skill-bar-fill" style="--w:95%"></div></div>
              <span class="skill-percent">95%</span>
            </div>
            <div class="skill-item">
              <span class="skill-name"><i class="fab fa-js"></i> JavaScript</span>
              <div class="skill-bar-bg"><div class="skill-bar-fill" style="--w:88%"></div></div>
              <span class="skill-percent">88%</span>
            </div>
            <div class="skill-item">
              <span class="skill-name"><i class="fab fa-react"></i> React</span>
              <div class="skill-bar-bg"><div class="skill-bar-fill" style="--w:82%"></div></div>
              <span class="skill-percent">82%</span>
            </div>
            <div class="skill-item">
              <span class="skill-name"><i class="fas fa-database"></i> Node.js</span>
              <div class="skill-bar-bg"><div class="skill-bar-fill" style="--w:78%"></div></div>
              <span class="skill-percent">78%</span>
            </div>
          </div>
        </div>

        <!-- YÊU THÍCH — làm sáng nổi bật -->
        <div class="section-block hobbies-block">
          <h3 class="section-title">
            <i class="fas fa-heart"></i> Yêu thích
          </h3>
          <div class="hobbies-grid">
            <div class="hobby-item">
              <i class="fas fa-music"></i>
              <span>Nghe nhạc</span>
            </div>
            <div class="hobby-item">
              <i class="fas fa-gamepad"></i>
              <span>Chơi game</span>
            </div>
            <div class="hobby-item">
              <i class="fas fa-book"></i>
              <span>Đọc sách</span>
            </div>
            <div class="hobby-item">
              <i class="fas fa-plane"></i>
              <span>Du lịch</span>
            </div>
            <div class="hobby-item">
              <i class="fas fa-camera"></i>
              <span>Nhiếp ảnh</span>
            </div>
            <div class="hobby-item">
              <i class="fas fa-utensils"></i>
              <span>Nấu ăn</span>
            </div>
          </div>
        </div>

        <!-- Liên hệ & social -->
        <div class="contact-links">
          <div class="email">
            <i class="fas fa-envelope"></i>
            <a id="email-link" href="#"><span id="email"></span></a>
          </div>
          <div class="social-icons">
            <a id="link-github"    href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
            <a id="link-linkedin"  href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            <a id="link-twitter"   href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
            <a id="link-instagram" href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
